# Netlify: the "portfoliogiveaway" project publishes only the giveaway/ folder from this repo.
# The Squarespace loaders read files straight from GitHub and are not affected by this file.
[build]
  base = "giveaway"
  publish = "."
  command = ""

[[redirects]]
  from = "/work"
  to = "/work/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
