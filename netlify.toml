# One repo, two Netlify projects. build.sh picks what to publish from the project name:
#   portfoliodupe      -> the full byninaaustin.com site (site/build.py)
#   portfoliogiveaway  -> the Portfolio Giveaway (giveaway/)
# The Squarespace loaders read files straight from GitHub and are not affected by this file.
[build]
  command = "sh build.sh"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
